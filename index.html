<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MorphoTV - 在线观影</title>
    <script>
      // 没有配置时默认使用同域代理，换电脑/浏览器也能直接进首页
      if (!localStorage.getItem("PROXY_BASE_URL")) {
        localStorage.setItem("PROXY_BASE_URL", "/proxy/");
      }
    </script>
    <script>
      // 黄果源：注册到采集站列表，走同域 /huangguo 适配层
      (function () {
        try {
          var custom = JSON.parse(localStorage.getItem("customApiSites") || "[]");
          if (!Array.isArray(custom)) custom = [];
          if (!custom.some(function (site) { return site && site.key === "huangguo"; })) {
            custom.push({
              key: "huangguo",
              name: "黄果短剧",
              api: location.origin + "/huangguo",
              isCustom: true,
            });
            localStorage.setItem("customApiSites", JSON.stringify(custom));
          }

          var selected = JSON.parse(localStorage.getItem("selectedApiSites") || "[]");
          if (!Array.isArray(selected)) selected = [];
          if (!localStorage.getItem("huangguoSourceAdded")) {
            if (!selected.length) selected.push("heimuer");
            if (!selected.includes("huangguo")) selected.push("huangguo");
            localStorage.setItem("selectedApiSites", JSON.stringify(selected));
            localStorage.setItem("huangguoSourceAdded", "1");
          }
        } catch (error) {
          console.warn("注册黄果源失败:", error);
        }
      })();
    </script>
    <script>
      // 上游池由服务端定时/后台同步，前端只异步读取诊断接口，不再用同步 XHR 阻塞首屏。
      (function () {
        function syncUpstreams() {
          fetch("/huangguo/?ac=upstreams", {
            cache: "no-store",
            credentials: "same-origin",
            headers: { Accept: "application/json" },
          })
            .then(function (response) {
              return response.ok ? response.json() : null;
            })
            .then(function (data) {
              if (!data || !Array.isArray(data.upstreams)) return;
              try {
                // 诊断信息只保留轻量字段，供设置页/控制台排查。
                localStorage.setItem(
                  "huangguoUpstreams",
                  JSON.stringify({
                    updatedAt: data.updatedAt,
                    defaultSlug: data.defaultSlug,
                    count: data.count,
                    upstreams: data.upstreams.map(function (item) {
                      return {
                        slug: item.slug,
                        name: item.name,
                        kind: item.kind,
                        status: item.status,
                        latencyMs: item.latencyMs,
                        lastError: item.lastError,
                      };
                    }),
                  })
                );

                // 只拿到默认上游时不重建列表，避免一次同步失败把已有源清空。
                if (data.upstreams.length < 2) return;

                var origin = location.origin;
                var managed = [];
                data.upstreams.forEach(function (item) {
                  if (!item || !item.slug) return;
                  // 默认黄果继续用同步注册的 key=huangguo 源，避免重复。
                  if (item.kind === "huangguo" || item.slug === data.defaultSlug) return;
                  managed.push({
                    key: "hg_" + item.slug,
                    name: item.name || item.slug,
                    api: origin + "/huangguo/" + item.slug,
                    isCustom: true,
                  });
                });
                if (!managed.length) return;

                // 把旧版 remote_* 直连源和上一轮 hg_* 源一起替换成走服务端适配层的源。
                var custom = JSON.parse(localStorage.getItem("customApiSites") || "[]");
                if (!Array.isArray(custom)) custom = [];
                var kept = custom.filter(function (site) {
                  if (!site) return false;
                  var key = String(site.key);
                  return key.indexOf("remote_") !== 0 && key.indexOf("hg_") !== 0;
                });
                localStorage.setItem(
                  "customApiSites",
                  JSON.stringify(kept.concat(managed))
                );

                var managedKeys = {};
                managed.forEach(function (site) {
                  managedKeys[site.key] = 1;
                });
                var selected = JSON.parse(localStorage.getItem("selectedApiSites") || "[]");
                if (Array.isArray(selected)) {
                  var selectedKept = selected.filter(function (key) {
                    var value = String(key);
                    if (value.indexOf("remote_") === 0) return false;
                    if (value.indexOf("hg_") === 0) return !!managedKeys[value];
                    return true;
                  });
                  if (selectedKept.length !== selected.length) {
                    localStorage.setItem("selectedApiSites", JSON.stringify(selectedKept));
                  }
                }

                // 通知已挂载的首页源选择器立即重读，不必刷新页面。
                window.dispatchEvent(new Event("huangguo-upstreams-updated"));
              } catch (error) {
                console.warn("同步上游源列表失败:", error);
              }
            })
            .catch(function () {
              // 鉴权未通过或网络不可用时保持静默。
            });
        }

        if (document.readyState === "complete") {
          setTimeout(syncUpstreams, 0);
        } else {
          window.addEventListener("load", syncUpstreams, { once: true });
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
