<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MorphoTV - 在线观影</title>
    <script>
      // 没有配置时默认使用同域代理，换电脑/浏览器也能直接进首页
      if (!localStorage.getItem("PROXY_BASE_URL")) {
        localStorage.setItem("PROXY_BASE_URL", "/proxy/");
      }
    </script>
    <script>
      // 黄果源：注册到采集站列表，走同域 /huangguo 适配层
      (function () {
        try {
          var custom = JSON.parse(localStorage.getItem("customApiSites") || "[]");
          if (!Array.isArray(custom)) custom = [];
          if (!custom.some(function (site) { return site && site.key === "huangguo"; })) {
            custom.push({
              key: "huangguo",
              name: "黄果短剧",
              api: location.origin + "/huangguo",
              isCustom: true,
            });
            localStorage.setItem("customApiSites", JSON.stringify(custom));
          }

          var selected = JSON.parse(localStorage.getItem("selectedApiSites") || "[]");
          if (!Array.isArray(selected)) selected = [];
          if (!localStorage.getItem("huangguoSourceAdded")) {
            if (!selected.length) selected.push("heimuer");
            if (!selected.includes("huangguo")) selected.push("huangguo");
            localStorage.setItem("selectedApiSites", JSON.stringify(selected));
            localStorage.setItem("huangguoSourceAdded", "1");
          }
        } catch (error) {
          console.warn("注册黄果源失败:", error);
        }
      })();
    </script>
    <script>
      // 上游池在服务端定时刷新（5h TTL + 后台刷新），前端只负责让源列表跟上：
      // 用 updatedAt + slug 集合做指纹，池子没变就什么都不做；
      // 变了也只增删 hg_*，内置源 / 用户自建源 / remote_* 一律原样保留。
      (function () {
        var SYNC_KEY = "huangguoSourceSync";
        var INTERVAL_MS = 10 * 60 * 1000;
        var MANAGED_PREFIX = "hg_";
        var running = false;

        function readArray(key) {
          try {
            var parsed = JSON.parse(localStorage.getItem(key) || "[]");
            return Array.isArray(parsed) ? parsed : [];
          } catch (error) {
            return [];
          }
        }

        function writeArray(key, value) {
          try {
            localStorage.setItem(key, JSON.stringify(value));
          } catch (error) {
            console.warn("写入 " + key + " 失败:", error);
          }
        }

        function fingerprintOf(data) {
          var slugs = (data.upstreams || [])
            .map(function (item) {
              return item && item.slug;
            })
            .filter(Boolean)
            .sort();
          return [data.updatedAt || "", slugs.join(",")].join("|");
        }

        function managedSites(data) {
          var origin = location.origin;
          var managed = [];
          (data.upstreams || []).forEach(function (item) {
            if (!item || !item.slug) return;
            // 默认黄果继续用同步注册的 key=huangguo 源，避免重复；
            // 其他黄果线路（镜像站）单独列成一个源，方便国内直连时换线。
            if (item.slug === data.defaultSlug) return;
            managed.push({
              key: MANAGED_PREFIX + item.slug,
              name: item.name || item.slug,
              api: origin + "/huangguo/" + item.slug,
              isCustom: true,
            });
          });
          return managed;
        }

        function apply(data) {
          var managed = managedSites(data);
          var managedKeys = {};
          managed.forEach(function (item) {
            managedKeys[item.key] = 1;
          });

          // 只动 hg_*：其他源（内置、用户自建、remote_*）全部保留。
          var current = readArray("customApiSites");
          var byKey = {};
          current.forEach(function (site) {
            if (!site || !site.key) return;
            if (String(site.key).indexOf(MANAGED_PREFIX) === 0) return;
            byKey[site.key] = site;
          });
          managed.forEach(function (site) {
            byKey[site.key] = site;
          });
          var next = Object.keys(byKey).map(function (key) {
            return byKey[key];
          });
          if (JSON.stringify(next) !== JSON.stringify(current)) {
            writeArray("customApiSites", next);
          }

          // 已选中的源：只清理已经消失的 hg_*，别的选择一律不动。
          var selected = readArray("selectedApiSites");
          var selectedKept = selected.filter(function (key) {
            var value = String(key);
            if (value.indexOf(MANAGED_PREFIX) !== 0) return true;
            return !!managedKeys[value];
          });
          if (selectedKept.length !== selected.length) {
            writeArray("selectedApiSites", selectedKept);
          }

          return managed.length;
        }

        function storeDiagnostics(data) {
          try {
            localStorage.setItem(
              "huangguoUpstreams",
              JSON.stringify({
                updatedAt: data.updatedAt,
                defaultSlug: data.defaultSlug,
                count: data.count,
                upstreams: (data.upstreams || []).map(function (item) {
                  return {
                    slug: item.slug,
                    name: item.name,
                    kind: item.kind,
                    status: item.status,
                    latencyMs: item.latencyMs,
                    lastError: item.lastError,
                  };
                }),
              })
            );
          } catch (error) {
            // 诊断信息写不进去不影响播放。
          }
        }

        function sync(attempt) {
          if (running) return;
          running = true;
          fetch("/huangguo/?ac=upstreams", {
            cache: "no-store",
            credentials: "same-origin",
            headers: { Accept: "application/json" },
          })
            .then(function (response) {
              return response.ok ? response.json() : null;
            })
            .then(function (data) {
              if (!data || !Array.isArray(data.upstreams) || !data.upstreams.length) {
                throw new Error("上游池为空");
              }
              storeDiagnostics(data);

              var fingerprint = fingerprintOf(data);
              var previous = "";
              try {
                previous = localStorage.getItem(SYNC_KEY) || "";
              } catch (error) {
                previous = "";
              }
              // 指纹没变说明池子没变，不重写、不触发重渲染。
              if (previous === fingerprint) return;

              var count = apply(data);
              try {
                localStorage.setItem(SYNC_KEY, fingerprint);
              } catch (error) {
                // 忽略隐私模式下的写入失败。
              }
              if (count > 0) {
                // 通知已挂载的首页源选择器立即重读，不必刷新页面。
                window.dispatchEvent(new Event("huangguo-upstreams-updated"));
              }
            })
            .catch(function () {
              // 鉴权未通过或网络不可用时保持静默，稍后补一次。
              if ((attempt || 0) < 1) {
                setTimeout(function () {
                  sync((attempt || 0) + 1);
                }, 1500);
              }
            })
            .then(function () {
              running = false;
            });
        }

        function start() {
          sync(0);
          // 长时间挂着的页面也能跟上池子变化（切回标签页或每 10 分钟）。
          setInterval(function () {
            if (document.visibilityState !== "visible") return;
            sync(0);
          }, INTERVAL_MS);
          document.addEventListener("visibilitychange", function () {
            if (document.visibilityState === "visible") sync(0);
          });
        }

        if (document.readyState === "complete") {
          setTimeout(start, 0);
        } else {
          window.addEventListener("load", start, { once: true });
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
