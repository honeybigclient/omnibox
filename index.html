<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MorphoTV - 在线观影</title>
    <script>
      // 没有配置时默认使用同域代理，换电脑/浏览器也能直接进首页
      if (!localStorage.getItem("PROXY_BASE_URL")) {
        localStorage.setItem("PROXY_BASE_URL", "/proxy/");
      }
    </script>
    <script>
      // 黄果源：注册到采集站列表，走同域 /huangguo 适配层
      (function () {
        try {
          var custom = JSON.parse(localStorage.getItem("customApiSites") || "[]");
          if (!Array.isArray(custom)) custom = [];
          if (!custom.some(function (site) { return site && site.key === "huangguo"; })) {
            custom.push({
              key: "huangguo",
              name: "黄果短剧",
              api: location.origin + "/huangguo",
              isCustom: true,
            });
            localStorage.setItem("customApiSites", JSON.stringify(custom));
          }

          var selected = JSON.parse(localStorage.getItem("selectedApiSites") || "[]");
          if (!Array.isArray(selected)) selected = [];
          if (!localStorage.getItem("huangguoSourceAdded")) {
            if (!selected.length) selected.push("heimuer");
            if (!selected.includes("huangguo")) selected.push("huangguo");
            localStorage.setItem("selectedApiSites", JSON.stringify(selected));
            localStorage.setItem("huangguoSourceAdded", "1");
          }
        } catch (error) {
          console.warn("注册黄果源失败:", error);
        }
      })();
    </script>
    <script>
      // 从上游最新 tag 同步 type 1 采集站（6 小时缓存，避免每次打开都阻塞）
      (function () {
        try {
          var CACHE_KEY = "remoteSourcesUpdatedAt";
          var last = Number(localStorage.getItem(CACHE_KEY) || 0);
          if (Date.now() - last < 6 * 60 * 60 * 1000) return;

          var proxyBase = localStorage.getItem("PROXY_BASE_URL") || "/proxy/";
          if (proxyBase.slice(-1) !== "/") proxyBase += "/";

          var upstream =
            "https://cdn.jsdelivr.net/gh/SikROo/huangguo-spider@latest/all_sources_config.json";

          var xhr = new XMLHttpRequest();
          xhr.open("GET", proxyBase + encodeURIComponent(upstream), false);
          xhr.send(null);
          if (xhr.status < 200 || xhr.status >= 300) return;

          var data = JSON.parse(xhr.responseText);
          var sites = Array.isArray(data.sites) ? data.sites : [];
          var remote = [];
          sites.forEach(function (site) {
            if (Number(site.type) !== 1) return;
            var api = String(site.api || "").trim().replace(/\/+$/, "");
            var base = "";
            if (/\/api\.php\/provide\/vod$/i.test(api)) {
              base = api.replace(/\/api\.php\/provide\/vod$/i, "");
            } else if (/^https?:\/\/[^/]+$/i.test(api)) {
              base = api;
            }
            // 其他自定义接口路径（api/json.php 等）暂时跳过
            if (!base) return;
            remote.push({
              key: "remote_" + site.key,
              name: site.name,
              api: base,
              isCustom: true,
            });
          });

          var custom = JSON.parse(localStorage.getItem("customApiSites") || "[]");
          if (!Array.isArray(custom)) custom = [];
          custom = custom.filter(function (site) {
            return site && String(site.key).indexOf("remote_") !== 0;
          });
          localStorage.setItem("customApiSites", JSON.stringify(custom.concat(remote)));
          localStorage.setItem(CACHE_KEY, String(Date.now()));
        } catch (error) {
          console.warn("同步远程采集站失败:", error);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
